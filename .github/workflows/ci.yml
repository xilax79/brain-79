name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BRAIN79_PERF_FACTOR: ${{ matrix.os == 'windows-latest' && '5' || '3' }}
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -q --basetemp="${RUNNER_TEMP:-/tmp}/.pytest_tmp"

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run brain79 lint
        run: uv run brain79 lint --strict

      - name: Run brain79 ci-check
        run: uv run brain79 ci-check --write-step-summary

      - name: Run brain79 doctor
        run: |
          uv run brain79 doctor --format json > doctor_report.json || true
          uv run python -m tests.test_ci_workflow --validate-doctor doctor_report.json

      - name: Upload pytest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-tmp-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/.pytest_tmp
          include-hidden-files: true
          if-no-files-found: ignore

  test-polyglot:
    name: test-polyglot (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BRAIN79_REQUIRE_POLYGLOT: "1"
      PYTHONUTF8: "1"
      BRAIN79_PERF_FACTOR: ${{ matrix.os == 'windows-latest' && '5' || '3' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (with polyglot extra)
        run: uv sync --group dev --extra polyglot

      - name: Run pytest
        run: uv run pytest -q --basetemp="${RUNNER_TEMP:-/tmp}/.pytest_tmp"

      - name: Run mypy
        run: uv run mypy src tests

      - name: Verify brain79 stats JSON output
        run: uv run brain79 stats --format json | uv run python -c "import json, sys; json.load(sys.stdin)"

      - name: Upload pytest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-tmp-polyglot-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/.pytest_tmp
          include-hidden-files: true
          if-no-files-found: ignore
