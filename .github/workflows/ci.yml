name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -q --basetemp=.pytest_tmp

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run brain79 lint
        run: uv run brain79 lint --strict

      - name: Run brain79 doctor
        run: |
          uv run brain79 doctor --format json > doctor_report.json || true
          uv run python -m tests.test_ci_workflow --validate-doctor doctor_report.json

      - name: Upload pytest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-tmp-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .pytest_tmp
