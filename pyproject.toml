[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain79"
version = "0.1.0"
description = "Per-project AI memory system based on Karpathy's LLM-Wiki method"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "filelock>=3.32.2",
]

[project.scripts]
brain79 = "brain79.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brain79"]

[tool.hatch.build.targets.wheel.shared-data]
"src/brain79/templates" = "brain79/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"


[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]


