[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain79"
dynamic = ["version"]
description = "Per-project AI memory system based on Karpathy's LLM-Wiki method"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "filelock>=3.32.2",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
polyglot = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-ruby>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
brain79 = "brain79.__main__:main"

[tool.hatch.version]
path = "src/brain79/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brain79"]

[tool.hatch.build.targets.wheel.shared-data]
"src/brain79/templates" = "brain79/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "--strict-markers"
markers = [
    "chaos: stress tests, multiprocess contention, and fault injection",
    "gauntlet: multi-repo archetype lifecycle and scale tests",
    "perf: performance and latency benchmark tests",
]


[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter_bash",
    "tree_sitter_c_sharp",
    "tree_sitter_go",
    "tree_sitter_java",
    "tree_sitter_javascript",
    "tree_sitter_php",
    "tree_sitter_ruby",
    "tree_sitter_rust",
    "tree_sitter_typescript",
]
ignore_missing_imports = true
follow_untyped_imports = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "types-pyyaml>=6.0.12.20240917",
]


